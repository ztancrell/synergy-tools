name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  RUSTFLAGS: -D warnings

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libasound2-dev
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo test
      - run: cargo build --release

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo test
      - run: cargo build --release

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: rustup target add x86_64-apple-darwin
      - run: cargo test
      - run: cargo build --release
      - run: cargo build --release --target x86_64-apple-darwin
      - run: lipo -create -output synergy-tools target/release/synergy-tools target/x86_64-apple-darwin/release/synergy-tools
      - uses: actions/upload-artifact@v4
        with:
          name: synergy-tools-macos-universal
          path: synergy-tools
