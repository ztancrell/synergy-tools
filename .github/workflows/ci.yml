name: CI

on:
  push:
    branches-ignore: [main]   # main is built by release.yml (with this file), not twice
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  RUSTFLAGS: -D warnings

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libasound2-dev
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v7
        with:
          name: synergy-tools-linux-x86_64
          path: target/release/synergy-tools

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v7
        with:
          name: synergy-tools-windows-x86_64
          path: target/release/synergy-tools.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: rustup target add x86_64-apple-darwin
      - run: cargo test
      - run: cargo build --release
      - run: cargo build --release --target x86_64-apple-darwin
      - run: lipo -create -output synergy-tools target/release/synergy-tools target/x86_64-apple-darwin/release/synergy-tools
      - uses: actions/upload-artifact@v7
        with:
          name: synergy-tools-macos-universal
          path: synergy-tools
