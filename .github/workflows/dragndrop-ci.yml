name: dragndrop CI

on:
  push:
    branches: [main]
    paths: ['synergy-dragndrop/**', '.github/workflows/dragndrop-ci.yml']
  pull_request:
    paths: ['synergy-dragndrop/**', '.github/workflows/dragndrop-ci.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: synergy-dragndrop

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo test
      - run: cargo build --release

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo test
      - run: cargo build --release
