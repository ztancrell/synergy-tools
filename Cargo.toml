[package]
name = "synergy-audio"
version = "0.1.0"
edition = "2021"

[dependencies]
cpal = "0.18"

# Auto-mute of the Windows speakers (same version cpal already pulls in).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com"] }

[profile.release]
strip = true
