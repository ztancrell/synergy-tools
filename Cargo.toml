[package]
name = "synergy-tools"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
cpal = "0.18"
# Pairing (SPAKE2) and encrypted sessions (Noise NNpsk0).
snow = { version = "0.10", default-features = false, features = ["default-resolver-crypto"] }
spake2 = "0.4"
getrandom = "0.3"
sha2 = "0.10"
dirs = "7"
tao = "0.37"
# Linux: default backend = libappindicator (GTK), which falls back to an XEmbed status icon (tint2).
tray-icon = "0.26"

[profile.release]
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"
# Same gtk as tao/tray-icon (Cargo.lock) so no second copy is built; used for file drops.
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
# Auto-mute of the Windows speakers (same version cpal already pulls in).
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com"] }
